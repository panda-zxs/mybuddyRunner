name: MyBuddy managed build

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Update Server build task ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mybuddy-build-${{ inputs.task_id }}
  cancel-in-progress: false

env:
  TASK_ID: ${{ inputs.task_id }}
  CROSS_GIT_REV: 29d00c7803f221f1b3f35e561b03792368fb8339

jobs:
  prepare:
    environment: MYBUDDY
    runs-on: ubuntu-latest
    env:
      UPDATE_SERVER_URL: ${{ secrets.MYBUDDY_UPDATE_SERVER_URL }}
    outputs:
      source_commit: ${{ steps.plan.outputs.source_commit }}
      core_commit: ${{ steps.plan.outputs.core_commit }}
      mode: ${{ steps.plan.outputs.mode }}
      channel: ${{ steps.plan.outputs.channel }}
      core_tag: ${{ steps.plan.outputs.core_tag }}
      application_version: ${{ steps.plan.outputs.application_version }}
      core_needed: ${{ steps.plan.outputs.core_needed }}
      desktop_needed: ${{ steps.plan.outputs.desktop_needed }}
      core_matrix: ${{ steps.plan.outputs.core_matrix }}
      desktop_matrix: ${{ steps.plan.outputs.desktop_matrix }}
      platform_matrix: ${{ steps.plan.outputs.platform_matrix }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - id: plan
        name: Fetch and validate immutable task plan
        run: node scripts/fetch-plan.mjs
        env:
          MYBUDDY_BUILD_SECRET: ${{ secrets.MYBUDDY_BUILD_SECRET }}

  verify-core:
    environment: MYBUDDY
    needs: prepare
    if: (needs.prepare.outputs.mode == 'core' || needs.prepare.outputs.mode == 'bundle') && needs.prepare.outputs.core_needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPDATE_SERVER_URL: ${{ secrets.MYBUDDY_UPDATE_SERVER_URL }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - name: Load Core verification configuration
        id: config
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const config = JSON.parse(fs.readFileSync("scripts/core-verification.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `toolchain=${config.toolchain}\n`);
            for (const [key, value] of Object.entries(config.environment)) {
              fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
            }
          '
      - name: Restore successful Core verification
        id: verified
        uses: actions/cache/restore@v4
        with:
          path: .core-verification
          # Exact match only; packaging changes do not invalidate verification.
          key: core-verified-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-rust${{ steps.config.outputs.toolchain }}-${{ needs.prepare.outputs.core_commit }}-${{ hashFiles('scripts/verify-core.sh', 'scripts/core-verification.json', 'scripts/download.mjs', 'scripts/download-retry.mjs', 'scripts/plan.mjs') }}
      - name: Download frozen Core source for verification
        if: steps.verified.outputs.cache-hit != 'true'
        run: node scripts/download.mjs source core core-source.zip
        env:
          MYBUDDY_BUILD_SECRET: ${{ secrets.MYBUDDY_BUILD_SECRET }}
      - name: Extract Core verification source
        if: steps.verified.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir core-source
          unzip -q core-source.zip -d core-source
          SOURCE_DIR=$(find core-source -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$SOURCE_DIR"
          # Keep Cargo paths stable across GitLab archives with different commit names.
          mv "$SOURCE_DIR" core-verify-src
          echo "SOURCE_DIR=core-verify-src" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.verified.outputs.cache-hit != 'true'
        with:
          toolchain: ${{ steps.config.outputs.toolchain }}
          components: rustfmt, clippy
      - name: Cache Core verification dependencies
        if: steps.verified.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: core-verify-src -> target
          prefix-key: mybuddy-core-verify-v1
          cache-on-failure: true
          cache-bin: false
      - name: Verify Core formatting, lint and workspace tests
        if: steps.verified.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/verify-core.sh
      - name: Record successful Core verification
        if: success() && steps.verified.outputs.cache-hit != 'true'
        shell: bash
        env:
          VERIFIED_CORE_COMMIT: ${{ needs.prepare.outputs.core_commit }}
        run: |
          mkdir -p .core-verification
          printf '%s\n' "$VERIFIED_CORE_COMMIT" > .core-verification/commit
      - name: Save successful Core verification
        if: success() && steps.verified.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .core-verification
          key: ${{ steps.verified.outputs.cache-primary-key }}
      - name: Report Core verification reuse
        if: steps.verified.outputs.cache-hit == 'true'
        run: echo 'Exact Core verification cache hit; formatting, lint and workspace tests already passed for this commit and workflow.'

  platforms:
    needs: [prepare, verify-core]
    if: always() && !cancelled() && needs.prepare.result == 'success' && (needs.verify-core.result == 'success' || needs.verify-core.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.platform_matrix) }}
    uses: ./.github/workflows/platform.yml
    secrets: inherit
    with:
      task_id: ${{ inputs.task_id }}
      platform_matrix: ${{ format('{{"include":[{0}]}}', toJSON(matrix)) }}
      core_needed: ${{ matrix.core_needed }}
      desktop_needed: ${{ matrix.desktop_needed }}
      source_commit: ${{ needs.prepare.outputs.source_commit }}
      core_commit: ${{ needs.prepare.outputs.core_commit }}
      core_tag: ${{ needs.prepare.outputs.core_tag }}
      application_version: ${{ needs.prepare.outputs.application_version }}
      channel: ${{ needs.prepare.outputs.channel }}

  complete:
    environment: MYBUDDY
    needs: [prepare, verify-core, platforms]
    env:
      UPDATE_SERVER_URL: ${{ secrets.MYBUDDY_UPDATE_SERVER_URL }}
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - name: Report task result
        shell: bash
        run: |
          MODE='${{ needs.prepare.outputs.mode }}'
          VERIFY='${{ needs.verify-core.result }}'
          CORE='${{ needs.platforms.result }}'
          DESKTOP='${{ needs.platforms.result }}'
          SUCCESS=false
          CORE_NEEDED='${{ needs.prepare.outputs.core_needed }}'
          DESKTOP_NEEDED='${{ needs.prepare.outputs.desktop_needed }}'
          if [ "$MODE" = core ] && { [ "$CORE" = success ] || [ "$CORE_NEEDED" = false ]; }; then SUCCESS=true; fi
          if [ "$MODE" = desktop ] && { [ "$DESKTOP" = success ] || [ "$DESKTOP_NEEDED" = false ]; }; then SUCCESS=true; fi
          if [ "$MODE" = bundle ] && { [ "$CORE" = success ] || [ "$CORE_NEEDED" = false ]; } && { [ "$DESKTOP" = success ] || [ "$DESKTOP_NEEDED" = false ]; }; then SUCCESS=true; fi
          if [ "$VERIFY" = failure ] || [ "$VERIFY" = cancelled ]; then SUCCESS=false; fi
          node scripts/complete.mjs "$SUCCESS" "verify=$VERIFY core=$CORE desktop=$DESKTOP"
        env:
          MYBUDDY_BUILD_SECRET: ${{ secrets.MYBUDDY_BUILD_SECRET }}
