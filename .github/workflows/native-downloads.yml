name: Verify native build downloads
on:
  workflow_dispatch:
  push:
    branches: [main, codex/github-asset-auth-20261109]
    paths:
      - .github/workflows/native-downloads.yml
      - scripts/github-release*
      - scripts/prefetch-*
      - scripts/setup-bun-fallback*
      - scripts/native-download-smoke.mjs
      - scripts/video-tools-release.json
      - scripts/computer-use-release.fixture.json
permissions:
  contents: read
jobs:
  downloads:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Unit tests
        run: node --test scripts/github-release.test.mjs scripts/prefetch-computer-use.test.mjs scripts/prefetch-video-tools.test.mjs scripts/setup-bun-fallback.test.mjs
      - name: Verify real native downloads and offline caches
        run: node scripts/native-download-smoke.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
